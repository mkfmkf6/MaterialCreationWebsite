spring:
  application:
    name: material-creation-website
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/material_creation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:local-dev-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  simulation:
    step-delay-ms: ${SIMULATION_STEP_DELAY_MS:1800}
    fail-stage: ${SIMULATION_FAIL_STAGE:}
